naftiko: 1.0.0-alpha2
info:
  label: Helidon Observe (Health & Metrics) API — OpenAPI
  description: 'Helidon Observe (Health & Metrics) API — OpenAPI. 1 operations. Lead operation: Helidon OpenAPI document.
    Self-contained Naftiko capability covering one Helidon business surface.'
  tags:
  - Helidon
  - OpenAPI
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    HELIDON_API_KEY: HELIDON_API_KEY
capability:
  consumes:
  - type: http
    namespace: observe-openapi
    baseUri: http://localhost:8080
    description: Helidon Observe (Health & Metrics) API — OpenAPI business capability. Self-contained, no shared references.
    resources:
    - name: openapi
      path: /openapi
      operations:
      - name: getopenapi
        method: GET
        description: Helidon OpenAPI document
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: observe-openapi-rest
    port: 8080
    description: REST adapter for Helidon Observe (Health & Metrics) API — OpenAPI. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/openapi
      name: openapi
      description: REST surface for openapi.
      operations:
      - method: GET
        name: getopenapi
        description: Helidon OpenAPI document
        call: observe-openapi.getopenapi
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: observe-openapi-mcp
    port: 9090
    transport: http
    description: MCP adapter for Helidon Observe (Health & Metrics) API — OpenAPI. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: helidon-openapi-document
      description: Helidon OpenAPI document
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: observe-openapi.getopenapi
      outputParameters:
      - type: object
        mapping: $.
